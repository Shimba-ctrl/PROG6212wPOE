name: Validate Repository Structure
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  check-docs-structure:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."
 
      - name: Check ERD file exists (PNG or PDF)
        run: |
          if ls docs/*.png 1> /dev/null 2>&1 || ls docs/*.pdf 1> /dev/null 2>&1; then
            echo "ERD file found."
          else
            echo "ERROR: No PNG or PDF file found in /docs for the ERD."
            exit 1
          fi
 
      - name: Check API endpoint plan exists (PDF or Markdown)
        run: |
          if ls docs/*.md 1> /dev/null 2>&1 || ls docs/*.pdf 1> /dev/null 2>&1; then
            echo "API endpoint plan found."
          else
            echo "ERROR: No Markdown or PDF file found in /docs for the API endpoint plan."
            exit 1
          fi
 
      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: No .sql file found in /docs."
            exit 1
          fi
          echo "SQL script found."
 
      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."
 
      - name: All checks passed
        run: echo "Repository structure is valid for Part 1 submission."
 
