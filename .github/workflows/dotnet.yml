
name: RaceDay API Build and Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore PROG6212_PART2/PROG6212_PART2.sln

      - name: Build solution
        run: dotnet build PROG6212_PART2/PROG6212_PART2.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test PROG6212_PART2/PROG6212_PART2.sln --configuration Release --no-build
